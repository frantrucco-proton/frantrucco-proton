<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112"
     role="img" aria-label="Dumpling">
  <!-- The emoji is text, not a picture, so it renders in each visitor's own
       emoji font and looks native on their device. -->
  <text x="56" y="57" font-size="76" text-anchor="middle" dominant-baseline="central"
        font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🥟</text>
</svg>
